<style>
:root{--ink:#000;--bg:#f5f5f7;--mute:#6e6e73;--line:#d2d2d7;--f:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}

#ed{min-height:420px;max-height:70vh;overflow:auto;padding:22px 26px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:17px;line-height:1.6;outline:none}
#ed:focus{outline:2px solid #000;outline-offset:-1px}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
#ed p{margin-bottom:1em}#ed h2{font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1.15;margin:1em 0 .4em}

.pv img{aspect-ratio:4/3;margin:.6em 0}

.dfs{width:100%;max-width:1504px;margin:20px auto 0;background:#fff;border:1px solid #000;border-radius:6px;position:relative;container-type:inline-size;aspect-ratio:1.4;overflow:hidden}

.dfb{height:100%;font-family:var(--f);font-size:var(--fs,1.45cqw);line-height:1.45;column-count:2;column-gap:4.4cqw;column-fill:auto;column-rule:1px solid var(--line);text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow:hidden}
.dfs.short .dfb{text-align:left}.dfs.short .dfb p{break-inside:avoid}
.dfb p{margin-bottom:1.05em}.dfb p:empty{display:none}
.dfb>p:first-child::first-letter{float:left;font-weight:900;font-size:4.6em;line-height:.8;padding:.06em .1em 0 0}
.dfb h2{font-weight:800;font-size:1.45em;letter-spacing:-.03em;line-height:1.15;margin:1.2em 0 .5em;break-after:avoid;text-align:left}
.dfb blockquote{font-weight:700;font-size:1.35em;line-height:1.25;letter-spacing:-.025em;border-top:3px solid #000;border-bottom:1px solid #000;padding:14px 0;margin:1.2em 0;text-align:left;break-inside:avoid}
.dfb ul,.dfb ol{margin:0 0 1.05em 1.3em}.dfb li{margin-bottom:.3em}
.dfb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;filter:grayscale(1) contrast(1.08);margin:1.2em 0;break-inside:avoid}
.dfb hr{border:0;border-top:1px solid #000;margin:1.4em 0}.dfb figure{margin:1.2em 0;break-inside:avoid}
.dfb figcaption{font-size:.76em;color:var(--mute);padding-top:6px;text-align:left}.dfb a{text-underline-offset:3px}
.dfs .pn{position:absolute;bottom:1.4cqw;font:600 .95cqw var(--f);z-index:1}.dfs .pn.l{left:3.8cqw}.dfs .pn.r{right:3.8cqw}
#pvm .dfs{width:100%}#mz .dfs{width:1504px;max-width:none;margin:0}
#mz{position:fixed;left:-20000px;top:0;width:1504px;visibility:hidden;pointer-events:none}
.mt .bar{height:6px;background:#e8e8ed;border-radius:3px;overflow:hidden;margin-top:8px}
.mt .bar i{display:block;height:100%;width:0;background:#000;transition:width .2s}
.mt.warn .bar i{background:#c00}.mt.warn .hint{color:#c00;font-weight:600}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pv{border:1px solid var(--line);border-radius:12px;padding:20px;max-height:640px;overflow:auto;background:#fff}
.pv img{display:block;width:100%;object-fit:cover;filter:grayscale(1) contrast(1.08)}
.pv p{margin-bottom:.9em}.pv h2{font-weight:800;font-size:22px;letter-spacing:-.03em;margin:1em 0 .4em}
.pv blockquote{font-weight:700;font-size:20px;border-top:3px solid #000;border-bottom:1px solid #000;padding:12px 0;margin:1em 0}
.pv ul{margin:0 0 1em 1.2em}.pv hr{margin:1.2em 0}.pv figure{margin:1em 0}.pv figure img{aspect-ratio:4/3}.pv figcaption{font-size:12px;color:var(--mute)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}.fgrid>div{min-width:0}
#fw{position:relative;display:inline-block;max-width:100%;cursor:crosshair;touch-action:none;border-radius:10px;overflow:hidden;line-height:0;background:#e5e5e5}
#fs{display:block;max-width:100%;max-height:260px;filter:grayscale(1) contrast(1.08);user-select:none;-webkit-user-drag:none}

.fr{display:block;overflow:hidden;background:#e5e5e5;border-radius:10px}.fr img{display:block;width:100%;object-fit:cover;filter:grayscale(1) contrast(1.08)}
#fz{padding:0}#fr0{margin-top:10px}
@media(max-width:999px){.fgrid{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#cfg{margin:20px auto;max-width:640px}

.hide{display:none!important}
@media(max-width:999px){.layout{grid-template-columns:1fr}.ed,.g2{grid-template-columns:1fr}.tb{top:56px}}
.mob{display:none}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#chips button{padding:6px 12px;border-radius:999px;font-size:13px}

#det>summary{font:600 14px var(--f);padding:13px 0;cursor:pointer;list-style:none}
#det>summary::-webkit-details-marker{display:none}
#det>summary::after{content:"▾";float:right;color:var(--mute)}#det[open]>summary::after{content:"▴"}
#det[open]{padding-bottom:14px}#det[open]>summary{border-bottom:1px solid var(--line);margin-bottom:2px}
@media(max-width:999px){
.mob{display:inline-block}.dsk{display:none!important}
header{padding:8px 10px}header b{display:none}header .row{width:100%;flex-wrap:nowrap;justify-content:space-between;gap:6px}header button{padding:9px 12px}

.layout aside.list{display:none}body.showlist .layout aside.list{display:block}body.showlist .layout section{display:none}
#det .g2{grid-template-columns:1fr 1fr}

}

@media(max-width:999px){.pvw{overflow-x:auto}#pvm .pvw .dfs{min-width:900px}#pvm{padding:10px}}
.tb button.p{background:#000;color:#fff}
.zo{display:none}.zen .zo{display:inline-block}.zen .zi{display:none}

.zen .tb{top:0}.zen #ed{min-height:80vh;max-height:none}
</style>

<body>
<header><b>Panel de redacción</b><div class="row"><button id="bcfg" title="Conexión">⚙<span class="dsk"> Conexión</span></button><button id="blist" class="mob hide">Noticias</button><button id="bnew" class="hide">Nueva<span class="dsk"> noticia</span></button><button id="bsave" class="p hide">Publicar</button></div></header>

<div id="cfg" class="box hide">
 <h2 style="letter-spacing:-.03em">Iniciar sesión</h2>
 <p class="hint" id="rp"></p>
 <label>Token de acceso de GitHub</label><input id="ck" type="password" autocomplete="off" placeholder="github_pat_…">
 <p class="hint">Se guarda solo en este navegador: lo pedirás una única vez.</p>
 <details id="adv" style="margin-top:12px"><summary class="hint" style="cursor:pointer">Opciones avanzadas</summary>
  <div class="g2"><div><label>Usuario u organización</label><input id="co"></div><div><label>Repositorio</label><input id="cr"></div>
  <div><label>Rama</label><input id="cb" placeholder="Automática"></div><div><label>Archivo de datos</label><input id="cp"></div></div></details>
 <div class="row" style="margin-top:16px"><button class="p" id="conn">Entrar</button><button id="bout">Cerrar sesión</button><button id="bins" class="hide">Instalar como app</button></div>
</div>

<div class="layout hide" id="app">
 <aside class="box list" style="align-self:start"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Noticias</b><span class="hint" id="cnt"></span></div>
<input class="srch" id="srch" placeholder="🔍 Buscar…" autocomplete="off">
<div id="lst"></div></aside>
 <section class="box">
  <div class="hint" id="st" style="margin:0 0 6px"></div><label style="margin-top:0">Titular</label><input id="t" placeholder="Un titular claro y fuerte"><div class="hint" id="tc"></div>

  <div class="dsk"><label>Fecha</label><input id="fe" type="date"></div><div><label>Portada</label><select id="po"><option value="0">Página interior</option><option value="1">Noticia de portada</option></select></div></div>
  <label>URL de la fotografía principal (se muestra siempre en blanco y negro)</label><div class="row" style="flex-wrap:nowrap"><input id="im" placeholder="Pega el enlace directo (acaba en .jpg o .png)"><button type="button" id="pas">Pegar</button></div><div class="hint" id="imh" style="color:#c00"></div>
  <div id="fbox" class="hide">
   <div class="fgrid">
    <div><label>Encuadre: pulsa o arrastra sobre la foto para marcar lo importante</label><div id="fw"><img id="fs" alt=""><i id="fd"></i></div>
     <label>Zoom</label><input id="fz" type="range" min="1" max="3" step="0.05" value="1"><button type="button" id="fr0">Restablecer encuadre</button></div>
    <div><label>Así se verá en portada y en el artículo (21:9)</label><span class="fr"><img id="fp1" alt="" style="aspect-ratio:21/9"></span>
     <label>Así se verá en las páginas interiores (16:10)</label><span class="fr"><img id="fp2" alt="" style="aspect-ratio:16/10"></span></div>
   </div><input id="fx" type="hidden" value="50"><input id="fy" type="hidden" value="50">
  </div>
  <div class="dsk"><label>Pie de foto</label><input id="pie"></div></details>
  <div class="tb" id="tb">
   <button data-c="zen"><span class="zi">⤢ Pantalla completa</span><span class="zo">✕ Salir</span></button><button data-c="pub" class="p zo">Publicar</button><span class="sep"></span>
   <button data-c="formatBlock" data-v="<p>">Párrafo</button><button data-c="formatBlock" data-v="<h2>">Subtítulo</button><button data-c="formatBlock" data-v="<blockquote>">Cita</button><span class="sep"></span>
   <button data-c="bold" title="Negrita (Ctrl+B)"><b>N</b></button><button data-c="italic" title="Cursiva (Ctrl+I)"><i>K</i></button><button data-c="underline" title="Subrayado (Ctrl+U)"><u>S</u></button><span class="sep"></span>
   <button data-c="insertUnorderedList">Lista</button><button data-c="insertOrderedList">Numerada</button><span class="sep"></span>
   <button data-c="link" title="Enlace (Ctrl+K)">Enlace</button><button data-c="unlink">Quitar enlace</button><button data-c="img">Foto</button><button data-c="insertHorizontalRule">Separador</button><span class="sep"></span>

  <div id="ed" contenteditable="true" spellcheck="true" data-ph="Escribe aquí tu noticia (corta: unas 500 palabras caben con letra normal). Atajos: «## » + espacio = subtítulo, «> » = cita, «- » = lista."></div><div class="hint" id="wc"></div><div class="mt hide" id="mt"><div class="bar"><i id="mb"></i></div><div class="hint" id="mtx"></div></div>
  <div class="row" style="margin-top:18px"><button class="p" id="bsave2">Publicar cambios</button><button id="bprev">Vista previa</button><button id="bview">Ver en la web</button><button class="d" id="bdel">Eliminar</button></div>
 </section>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
function md(s){const i=t=>esc(t).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>').replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
 return String(s||"").split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";let m;
  if(/^## /.test(b))return"<h2>"+i(b.slice(3))+"</h2>";if(/^> /.test(b))return"<blockquote>"+i(b.replace(/^> ?/gm,""))+"</blockquote>";
  if(/^- /.test(b))return"<ul>"+b.split("\n").map(x=>"<li>"+i(x.replace(/^- /,""))+"</li>").join("")+"</ul>";if(b==="---")return"<hr>";
  if(m=b.match(/^!\[([^\]]*)\]\((\S+)\)$/))return`<figure><img src="${esc(m[2])}"><figcaption>${esc(m[1])}</figcaption></figure>`;
  return"<p>"+i(b).replace(/\n/g,"<br>")+"</p>"}).join("")}
/* Medición: misma maqueta que noticias.html (2 páginas, letra adaptable) */
function dfFit(b,compact=true){const MAX=1.7,MIN=.9,sh=b.closest(".sheet,.dfs"),set=v=>b.style.setProperty("--fs",v+"cqw"),over=()=>b.scrollWidth>b.clientWidth+2;
 let s=MAX;sh.style.aspectRatio="";sh.classList.remove("short");b.style.columnFill="auto";set(MAX);
 if(over()){set(MIN);if(over())return{s:MIN,cut:true};let lo=MIN,hi=MAX;for(let i=0;i<8;i++){const m=(lo+hi)/2;set(m);if(over())hi=m;else lo=m}s=lo;set(s)}
 else if(compact){/* texto corto: la hoja se acorta para que no quede medio vacía */
  const R0=1.4;let lo=R0,hi=4.2;sh.classList.add("short");sh.style.aspectRatio=hi;
  if(over()){for(let i=0;i<8;i++){const m=(lo+hi)/2;sh.style.aspectRatio=m;if(over())hi=m;else lo=m}hi=lo}
  sh.style.aspectRatio=Math.max(R0,hi/1.08)}
 b.style.columnFill="balance";if(over())b.style.columnFill="auto";return{s,cut:false}}
function dfPct(b,s){b.style.setProperty("--fs",s+"cqw");const H=b.clientHeight,W=b.clientWidth,gap=parseFloat(getComputedStyle(b).columnGap)||0,cw=(W-gap)/2;
 b.style.columnCount=1;b.style.height="auto";b.style.width=cw+"px";b.style.overflow="visible";
 const h=b.scrollHeight;["columnCount","height","width","overflow"].forEach(p=>b.style[p]="");return h/(2*H)*100}
function measure(html){const mz=$("#mz");mz.innerHTML='<div class="dfs"><div class="in"><div class="dfb"></div></div></div>';const b=mz.querySelector(".dfb");
 b.innerHTML=String(html||"").replace(/<img[^>]*>/gi,"<img alt=''>");const words=(b.textContent.match(/\S+/g)||[]).length;
 const p145=dfPct(b,1.45),f=dfFit(b,false);let min=null,fill=100,over=0;
 if(f.cut)min=dfPct(b,.9);else{fill=dfPct(b,f.s);if(f.s<1.25){const p=dfPct(b,1.25);over=Math.max(5,Math.round(words*(1-100/p)))}}
 return{s:f.s,cut:f.cut,min,fill,over,room:Math.max(0,Math.round(words*(100/p145-1)))}}
function meter(){const h=clean($("#ed").innerHTML),w=($("#ed").innerText.trim().match(/\S+/g)||[]).length,box=$("#mt");
 if(!w){box.classList.add("hide");return}box.classList.remove("hide");
 const r=measure(h),px=Math.round(r.s*15);let msg,warn=true;
 if(r.cut)msg=`⚠ No cabe en 2 páginas: sobran unas ${Math.max(10,Math.round(w*(1-100/(r.min||110))))} palabras y el final se recortaría.`;
 else if(r.s<1.25)msg=`⚠ Cabe en 2 páginas, pero con letra pequeña (≈ ${px} px). Mejor acortar unas ${r.over} palabras.`;
 else if(r.s>=1.7&&r.fill<80){warn=false;msg=`Es corta: llena un ${Math.round(r.fill)} % de las 2 páginas y la hoja se acorta para no quedar vacía. Si quieres llenarla, añade unas ${r.room} palabras, una cita o una foto.`}
 else{warn=false;msg=`Cabe bien: letra de ≈ ${px} px y las 2 páginas al ${Math.round(r.fill)} %.`}
 box.classList.toggle("warn",warn);$("#mb").style.width=Math.min(100,r.fill)+"%";$("#mtx").textContent=msg}
/* Borrador automático: se guarda en este navegador mientras escribes */
let loading=false;
const readDraft=()=>{try{return JSON.parse(localStorage.gdraft||"null")}catch(e){return null}};
const clearDraft=()=>{clearTimeout(saveDraft.h);try{localStorage.removeItem("gdraft")}catch(e){}};
function saveDraft(){if(loading||!dirty)return;const n=read();
 if(!(n.titulo||n.subtitulo||$("#ed").innerText.trim()))return clearDraft();
 try{localStorage.gdraft=JSON.stringify({id:cur>=0&&items[cur]?items[cur].id:"",n,t:Date.now()});st("✓ Borrador guardado en este móvil · sin publicar")}catch(e){st("⚠ No se pudo guardar el borrador")}}

const guess=()=>{const m=location.hostname.match(/^(.+)\.github\.io$/);if(!m)return{};const s=location.pathname.split("/")[1]||"";return{o:m[1],r:s&&!s.includes(".")?s:m[1]+".github.io"}};

async function api(m,b){const c=C();
 const r=await fetch(`https://api.github.com/repos/${c.o}/${c.r}/contents/${c.p}`+(m==="GET"?`?ref=${c.b}&t=${Date.now()}`:""),{method:m,headers:{Authorization:"Bearer "+c.k,Accept:"application/vnd.github+json"},body:b&&JSON.stringify(b)});
 if(r.status===404&&m==="GET")return null;
 if(!r.ok)throw new Error((await r.json()).message||"Error de GitHub");return r.json()}
async function chk(){const c=C(),h={Authorization:"Bearer "+c.k,Accept:"application/vnd.github+json"},u=`https://api.github.com/repos/${c.o}/${c.r}`;
 const r=await fetch(u,{headers:h});
 if(r.status===401)throw new Error("El token no es válido o ha caducado");
 if(!r.ok)throw new Error(`No encuentro el repositorio ${c.o}/${c.r}. Revisa usuario y nombre, y que el token tenga acceso a ese repositorio`);
 const j=await r.json();if(!c.b){c.b=j.default_branch;localStorage.gaceta=JSON.stringify(c)}if(j.permissions&&!j.permissions.push)throw new Error("El token solo puede leer. Actívale Contents: Read and write");
 const b=await fetch(u+"/branches/"+encodeURIComponent(c.b),{headers:h});
 if(!b.ok)throw new Error(`La rama «${c.b}» no existe en el repositorio. Prueba con main o master`)}
async function load(){await chk();const j=await api("GET");items=j?JSON.parse(dec(j.content)):[];sha=j?j.sha:null;
 items.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));$("#cfg").classList.add("hide");$("#app").classList.remove("hide");$("#bnew").classList.remove("hide");$("#blist").classList.remove("hide");$("#bsave").classList.remove("hide");list();const dr=readDraft();open_(items.length?0:-1);
 if(dr&&(!dr.id||items.some(x=>x.id===dr.id))){if(confirm("Hay un borrador sin publicar"+(dr.n.titulo?" de «"+dr.n.titulo+"»":"")+". ¿Quieres recuperarlo?"))applyDraft(dr);else clearDraft()}else if(dr)clearDraft()}
async function commit(msg){const c=C();const j=await api("PUT",{message:msg,content:enc(JSON.stringify(items,null,1)),branch:c.b,sha:sha||undefined});sha=j.content.sha;dirty=false}

const gs={};vis.forEach(n=>{const idx=items.indexOf(n),mo=(n.fecha||"").slice(0,7)||"Sin fecha";(gs[mo]=gs[mo]||[]).push({n,idx})});

function open_(i){cur=i;const lbl=i>=0?"Actualizar":"Publicar";document.querySelectorAll("#bsave,#bsave2").forEach(b=>b.textContent=lbl);const n=i>=0?items[i]:{fecha:new Date().toISOString().slice(0,10),autor:C().au||"Redactor"};
 for(const k in F)$("#"+k).value=n[F[k]]||"";$("#fx").value=n.fx??50;$("#fy").value=n.fy??50;$("#fz").value=n.fz??1;$("#po").value=n.portada?"1":"0";$("#ed").innerHTML=toHtml(n.cuerpo);loading=true;upd();loading=false;dirty=false;st(cur>=0?"✓ Publicada · sin cambios":"Noticia nueva");list()}
function read(){const n={id:cur>=0?items[cur].id:""};for(const k in F)n[F[k]]=$("#"+k).value.trim();n.portada=$("#po").value==="1";n.cuerpo=clean($("#ed").innerHTML);n.fx=+$("#fx").value;n.fy=+$("#fy").value;n.fz=+$("#fz").value;return n}

 $("#fd").style.left=x+"%";$("#fd").style.top=y+"%"}
function imchk(){const u=$("#im").value.trim();let m="";if(u){try{const x=new URL(u),ext=/\.(jpe?g|png|webp|gif|avif)$/i.test(x.pathname);if(!/^https?:$/.test(x.protocol))m="⚠ El enlace debe empezar por https://";else if((/(^|\.)postimg\.cc$/i.test(x.hostname)&&x.hostname!=="i.postimg.cc")||!ext)m="⚠ Parece el enlace de una página, no de la imagen. Usa el «enlace directo» (acaba en .jpg o .png)."}catch(e){m="⚠ Esto no parece un enlace"}}$("#imh").textContent=m}

 $("#tc").textContent=tl?`${tl} caracteres`+(tl>80?" · Largo: en portada el titular se encoge":""):"";
 $("#sc").textContent=sl?`${sl} caracteres`+(sl>160?" · En las tarjetas solo se ven unas 3 líneas":""):"";
 clearTimeout(meter.h);meter.h=setTimeout(meter,250);if(!loading){clearTimeout(saveDraft.h);saveDraft.h=setTimeout(saveDraft,1200);st("● Cambios sin publicar")}const w=($("#ed").innerText.trim().match(/\S+/g)||[]).length;$("#wc").textContent=`${w} palabras · ${Math.max(1,Math.round(w/200))} min de lectura`;dirty=true}
const slug=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)||"noticia";
async function save(){const n=read(),wasNew=cur<0;if(!n.titulo)return toast("Escribe un titular antes de publicar");
 if(measure(n.cuerpo).cut&&!confirm("Esta noticia no cabe en 2 páginas y se recortará el final. ¿Publicar igualmente?"))return;
 if(!n.id)n.id=slug(n.titulo)+"-"+Date.now().toString(36).slice(-4);
 if(n.portada)items.forEach(x=>x.portada=false);
 if(cur>=0)items[cur]=n;else{items.unshift(n);cur=0}
 items.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));cur=items.findIndex(x=>x.id===n.id);
 try{await commit("Noticia: "+n.titulo);clearDraft();st("✓ Publicado a las "+hh());list();toast(wasNew?"Publicado. Formulario listo para otra noticia":"Publicado");if(wasNew)setTimeout(()=>open_(-1),700)}catch(e){toast("No se pudo publicar: "+e.message)}}
const OK=new Set("P H2 H3 B STRONG I EM U A UL OL LI BLOCKQUOTE BR HR IMG FIGURE FIGCAPTION".split(" "));
function clean(h){const d=new DOMParser().parseFromString(String(h).replace(/<(\/?)div\b/gi,"<$1p"),"text/html");
 (function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
  if(!OK.has(c.tagName)){if(["SCRIPT","STYLE","IFRAME","OBJECT","META","LINK"].includes(c.tagName)){c.remove();return}w(c);c.replaceWith(...c.childNodes);return}
  [...c.attributes].forEach(a=>{const k=a.name;if(!(c.tagName==="A"&&k==="href"||c.tagName==="IMG"&&(k==="src"||k==="alt")))c.removeAttribute(k)});
  if(c.tagName==="A"){if(!/^(https?:|mailto:)/i.test(c.getAttribute("href")||""))c.removeAttribute("href");c.target="_blank";c.rel="noopener"}
  if(c.tagName==="IMG"&&!/^https?:/i.test(c.getAttribute("src")||""))c.remove();else w(c)})})(d.body);
 d.body.querySelectorAll("p,h2,h3").forEach(p=>{if(!p.textContent.replace(/[\s\u00a0]/g,"")&&!p.querySelector("img"))p.remove()});
 return d.body.innerHTML}

 <p class="hint" id="pvh">Así se verá: página 1 (titular y foto) y páginas 2–3 (el texto). En el móvil, desliza de lado para ver la hoja entera.</p>${ok?cl:""}
 <h1>${esc(n.titulo||"Sin titular")}</h1><p style="font-size:20px;color:#333;margin-bottom:14px">${esc(n.subtitulo)}</p>
 ${n.img?`<span class="fr" style="margin-bottom:24px"><img src="${esc(n.img)}" style="aspect-ratio:21/9;object-position:${n.fx}% ${n.fy}%;transform:scale(${n.fz});transform-origin:${n.fx}% ${n.fy}%"></span>`:""}
