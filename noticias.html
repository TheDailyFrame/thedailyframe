<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Frame</title>
<link rel="alternate" type="application/rss+xml" title="The Daily Frame" href="rss.xml">
<link rel="preload" href="inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="inter.css">
<style>
:root{--ink:#000;--paper:#fafafa;--mute:#6e6e73;--line:#d2d2d7;--f:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 17px/1.6 var(--f);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;width:100%;object-fit:cover;background:#e5e5e5;filter:grayscale(1) contrast(1.08)}
.wrap{max-width:1560px;margin:auto;padding:0 28px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--ink)}
.top a.logo{font-weight:900;font-size:26px;letter-spacing:-.06em;text-decoration:none}
.top a{font:600 13px var(--f);text-decoration:none}
.dbl{height:8px;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink)}
article{padding:36px 0 20px}
.k{font:700 12px var(--f);display:inline-block;border-bottom:2px solid var(--ink);padding-bottom:2px;margin-bottom:14px}
h1.h{font-weight:900;font-size:clamp(38px,8vw,112px);letter-spacing:-.055em;line-height:.95}
.sub{font-size:clamp(20px,2.6vw,28px);line-height:1.3;color:#222;margin:22px 0 18px;max-width:780px;letter-spacing:-.015em}
.meta{display:flex;gap:18px;flex-wrap:wrap;font:500 13px var(--f);color:var(--mute);padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.meta b{color:var(--ink)}
.fr{display:block;overflow:hidden;background:#e5e5e5}
.photo img{aspect-ratio:21/9}
.cap{font-size:13px;color:var(--mute);padding:8px 0 0}
.sheet{width:100%;margin:34px auto;background:#fff;border:1px solid var(--ink);border-radius:6px;box-shadow:0 12px 32px -22px rgba(0,0,0,.18);position:relative;container-type:inline-size;aspect-ratio:1.4;overflow:hidden}
.in{position:absolute;inset:0;padding:3.2cqw 3.8cqw 4.4cqw}
.body{height:100%;font-size:var(--fs,1.45cqw);line-height:1.45;column-count:2;column-gap:4.4cqw;column-fill:auto;column-rule:1px solid var(--line);text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow:hidden}
.warn{display:none;max-width:1240px;margin:14px auto 0;padding:10px 14px;border:1px solid var(--ink);background:#fff;font:600 13px var(--f)}
.short .body{text-align:left}.body p{orphans:2;widows:2}
.body p{margin-bottom:1.05em}
.body>p:first-child::first-letter{float:left;font-weight:900;font-size:4.6em;line-height:.8;padding:.06em .1em 0 0}
.body h2{font-weight:800;font-size:1.45em;letter-spacing:-.03em;line-height:1.15;margin:1.2em 0 .5em;break-after:avoid;text-align:left}
.body blockquote{font-weight:700;font-size:1.35em;line-height:1.25;letter-spacing:-.025em;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;margin:1.2em 0;text-align:left;break-inside:avoid}
.body ul,.body ol{margin:0 0 1.05em 1.3em}.body img{display:block;width:100%;aspect-ratio:16/9;margin:1.2em 0;break-inside:avoid}.body p:empty{display:none}.body li{margin-bottom:.3em}
.body hr{border:0;border-top:1px solid var(--ink);margin:1.4em 0}
.body figure{margin:1.2em 0;break-inside:avoid}.body figure img{aspect-ratio:16/9}
.body figcaption{font-size:.76em;color:var(--mute);padding-top:6px;text-align:left}
.body a{text-underline-offset:3px}
.pn{position:absolute;bottom:1.4cqw;font:600 .95cqw var(--f);z-index:1}.pn.l{left:3.8cqw}.pn.r{right:3.8cqw}
.pn.m{left:50%;transform:translateX(-50%);color:var(--mute)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:10px 0 40px}
.pager a{border-top:2px solid var(--ink);padding-top:10px;text-decoration:none;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pager a small{display:block;font:500 12px var(--f);color:var(--mute);margin-bottom:4px}
.pager a:last-child{text-align:right}
.pdf{position:fixed;right:18px;bottom:18px;z-index:5;font:600 14px var(--f);border:0;background:#000;color:#fff;padding:12px 20px;border-radius:999px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.share{margin-left:auto;display:flex;gap:8px}
.share button{font:600 12px var(--f);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:3px 12px;border-radius:999px;cursor:pointer}
.share button:hover{background:var(--ink);color:#fff}
.rel{margin:10px 0 56px}
.rel .rt,.cartas .rt{font:800 14px var(--f);letter-spacing:-.01em;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:18px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.rel a{text-decoration:none;display:block}.rel img{aspect-ratio:16/10}.rel .fr{margin-bottom:12px}
.rel .k{margin-bottom:8px}
.rel h3{font-weight:800;font-size:21px;letter-spacing:-.035em;line-height:1.12}
.rel a:hover h3{text-decoration:underline;text-underline-offset:4px}
.cartas{margin:10px 0 60px}
.cartas p{font-size:14px;line-height:1.5;color:var(--mute);max-width:640px;margin-bottom:16px}
.cartas button{font:600 14px var(--f);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 20px;border-radius:999px;cursor:pointer}
.cartas button:hover{background:var(--ink);color:#fff}
.autor{font-size:14px;line-height:1.5;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin:-8px 0 22px;max-width:680px}.autor b{color:var(--ink)}
.pie{text-align:center;font-size:12px;color:var(--mute);padding:0 0 40px}.pie a{text-decoration:underline;text-underline-offset:3px}
.cartas p a{text-decoration:underline;text-underline-offset:3px}
.empty{padding:100px 0;text-align:center;color:var(--mute)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:899px){
 body{font-size:17px}.photo img{aspect-ratio:16/10}
 .rg{grid-template-columns:1fr;gap:30px}
 .sheet{border:0;border-radius:0;box-shadow:none;background:none;margin:20px 0;width:100%;aspect-ratio:auto;container-type:normal;overflow:visible}
 .sheet::after{display:none}
 .in{position:static;padding:0}
 .body{height:auto;overflow:visible;font-size:17px;column-count:1;text-align:left;column-rule:0}.pn{display:none}
}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;line-height:1.5}.pdf,.pager,.rel,.cartas,.share,.autor,.pie,.top a:not(.logo),.warn{display:none}
 .wrap{padding:0;max-width:none}
 .head{break-after:page}article{padding:10px 0 0}
 h1.h{font-size:56px!important}.sub{font-size:20px;margin:12px 0 10px}.meta{margin-bottom:12px}.photo img{aspect-ratio:21/6.5}
 .sheet{max-width:none;width:calc(186mm*1.4);margin:0 auto;border:0;border-radius:0;box-shadow:none;break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><a class="logo" href="index.html" id="logo">The Daily Frame</a><a href="index.html">Volver a la portada</a></div>
 <div class="dbl"></div>
 <main id="out"></main>
 <footer class="pie"><a href="legal.html">Aviso legal y cookies</a> · <a href="rss.xml">RSS</a></footer>
</div>
<button class="pdf" onclick="print()">Exportar PDF</button>
<script>
const NAME="The Daily Frame", DATA="data/noticias.json";
/* Comentarios: pega aquí el "shortname" de tu sitio en Disqus (ej. "thedailyframe"). Si está vacío, no se muestra nada. */
const DISQUS="https-thedailyframe-github-io-thedailyframe";
const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function md(s){
 const i=t=>esc(t).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
 return String(s||"").split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";let m;
  if(/^## /.test(b))return"<h2>"+i(b.slice(3))+"</h2>";
  if(/^> /.test(b))return"<blockquote>"+i(b.replace(/^> ?/gm,""))+"</blockquote>";
  if(/^- /.test(b))return"<ul>"+b.split("\n").map(x=>"<li>"+i(x.replace(/^- /,""))+"</li>").join("")+"</ul>";
  if(b==="---")return"<hr>";
  if(m=b.match(/^!\[([^\]]*)\]\((\S+)\)$/))return`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}"><figcaption>${esc(m[1])}</figcaption></figure>`;
  return"<p>"+i(b).replace(/\n/g,"<br>")+"</p>"}).join("");
}
const OK=new Set("P H2 H3 B STRONG I EM U A UL OL LI BLOCKQUOTE BR HR IMG FIGURE FIGCAPTION".split(" "));
function clean(h){const d=new DOMParser().parseFromString(String(h).replace(/<(\/?)div\b/gi,"<$1p"),"text/html");
 (function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
  if(!OK.has(c.tagName)){if(["SCRIPT","STYLE","IFRAME","OBJECT","META","LINK"].includes(c.tagName)){c.remove();return}w(c);c.replaceWith(...c.childNodes);return}
  [...c.attributes].forEach(a=>{const k=a.name;if(!(c.tagName==="A"&&k==="href"||c.tagName==="IMG"&&(k==="src"||k==="alt")))c.removeAttribute(k)});
  if(c.tagName==="A"){if(!/^(https?:|mailto:)/i.test(c.getAttribute("href")||""))c.removeAttribute("href");c.target="_blank";c.rel="noopener"}
  if(c.tagName==="IMG"&&!/^https?:/i.test(c.getAttribute("src")||""))c.remove();else w(c)})})(d.body);
 /* Elimina párrafos que solo contienen espacios, &nbsp; o <br> sueltos (el editor a veces los genera) */
 d.body.querySelectorAll("p,h2,h3").forEach(p=>{if(!p.textContent.replace(/[\s\u00a0]/g,"")&&!p.querySelector("img"))p.remove()});
 return d.body.innerHTML}
const q=(v,d,a,b)=>{v=parseFloat(v);return isNaN(v)?d:Math.min(b,Math.max(a,v))};
const fr=(n,alt)=>{const x=q(n.fx,50,0,100),y=q(n.fy,50,0,100),z=q(n.fz,1,1,3);return `<span class="fr"><img src="${esc(n.img)}" alt="${esc(alt||n.pie||n.titulo)}" style="object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%" loading="lazy"></span>`};
/* La noticia ocupa siempre 2 páginas: la letra se adapta al texto (grande si es corto, menor si es largo). Si no cabe ni al mínimo, avisa (añade #revisar a la URL) */
function dfFit(b,compact=true){const MAX=1.7,MIN=.9,sh=b.closest(".sheet,.dfs"),set=v=>b.style.setProperty("--fs",v+"cqw"),over=()=>b.scrollWidth>b.clientWidth+2;
 let s=MAX;sh.style.aspectRatio="";sh.classList.remove("short");b.style.columnFill="auto";set(MAX);
 if(over()){set(MIN);if(over())return{s:MIN,cut:true};let lo=MIN,hi=MAX;for(let i=0;i<8;i++){const m=(lo+hi)/2;set(m);if(over())hi=m;else lo=m}s=lo;set(s)}
 else if(compact){/* texto corto: la hoja se acorta para que no quede medio vacía */
  const R0=1.4;let lo=R0,hi=4.2;sh.classList.add("short");sh.style.aspectRatio=hi;
  if(over()){for(let i=0;i<8;i++){const m=(lo+hi)/2;sh.style.aspectRatio=m;if(over())hi=m;else lo=m}hi=lo}
  sh.style.aspectRatio=Math.max(R0,hi/1.08)}
 b.style.columnFill="balance";if(over())b.style.columnFill="auto";return{s,cut:false}}
function fitH(){const h=document.querySelector("h1.h");if(!h)return;
 if(matchMedia("(max-width:899px)").matches){h.style.fontSize="";return}
 let s=Math.min(innerWidth*.075,128);h.style.fontSize=s+"px";
 while((h.getBoundingClientRect().height>s*.95*3+2||h.getBoundingClientRect().height>innerHeight*.3)&&s>34){s-=2;h.style.fontSize=s+"px"}}
function fit(){fitH();const b=document.getElementById("bd"),w=document.getElementById("warn");if(!b)return;
 if(matchMedia("(max-width:899px)").matches){b.style.removeProperty("--fs");b.style.columnFill="";b.closest(".sheet").style.aspectRatio="";w.style.display="none";return}
 const r=dfFit(b),small=!r.cut&&r.s<1.25;
 if(r.cut)console.warn("La noticia no cabe en 2 páginas");
 w.textContent=r.cut?"⚠ No cabe en 2 páginas: el final queda recortado. Acorta el texto.":"Ojo: la letra queda pequeña para que quepa en 2 páginas. Conviene acortar el texto.";
 w.style.display=location.hash==="#revisar"&&(r.cut||small)?"block":"none"}
const body=c=>/^\s*</.test(c||"")?clean(c):md(c);
document.getElementById("logo").textContent=NAME;
const id=new URLSearchParams(location.search).get("id");
fetch(DATA+"?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>[]).then(all=>{
 all.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
 const k=all.findIndex(n=>n.id===id),n=all[k],o=document.getElementById("out");
 if(!n){o.innerHTML='<div class="empty">No encontramos esta noticia.<br><a href="index.html">Volver a la portada</a></div>';return}
 document.title=n.titulo+" · "+NAME;
const cl=document.createElement("link");cl.rel="canonical";cl.href=location.origin+location.pathname+"?id="+encodeURIComponent(n.id);document.head.appendChild(cl);
 const words=String(n.cuerpo||"").split(/\s+/).length,prev=all[k+1],next=all[k-1];
 const rel=[...all.filter(x=>x!==n&&x.seccion===n.seccion),...all.filter(x=>x!==n&&x.seccion!==n.seccion)].slice(0,3);
 o.innerHTML=`<article><div class="head">
  <div class="k">${esc(n.seccion||"Actualidad")}</div>
  <h1 class="h">${esc(n.titulo)}</h1>
  ${n.subtitulo?`<p class="sub">${esc(n.subtitulo)}</p>`:""}
  <div class="meta"><span>Por <b>${esc(n.autor||"Redacción")}</b></span><span>${fmt(n.fecha)}</span><span>${Math.max(1,Math.round(words/200))} min de lectura</span><span class="share"><button type="button" id="cp">Copiar enlace</button>${navigator.share?'<button type="button" id="sh">Compartir</button>':""}</span></div>
  ${n.img?`<div class="photo">${fr(n)}${n.pie?`<div class="cap">${esc(n.pie)}</div>`:""}</div>`:""}
  </div>
  <div class="warn" id="warn"></div>
  <div class="sheet"><div class="in"><div class="body" id="bd">${body(n.cuerpo)}</div></div><span class="pn l">2</span><span class="pn m">${esc(NAME)}</span><span class="pn r">3</span></div>
  ${n.bio?`<div class="autor"><b>${esc(n.autor||"Redacción")}</b> ${esc(n.bio)}</div>`:""}
  <div class="pager">${prev?`<a href="?id=${encodeURIComponent(prev.id)}"><small>Anterior</small>${esc(prev.titulo)}</a>`:"<span></span>"}${next?`<a href="?id=${encodeURIComponent(next.id)}"><small>Siguiente</small>${esc(next.titulo)}</a>`:"<span></span>"}</div>
  ${rel.length?`<section class="rel"><div class="rt">Sigue leyendo</div><div class="rg">${rel.map(x=>`<a href="?id=${encodeURIComponent(x.id)}">${x.img?fr(x):""}<div class="k">${esc(x.seccion||"Actualidad")}</div><h3>${esc(x.titulo)}</h3></a>`).join("")}</div></section>`:""}
  ${DISQUS?`<section class="cartas"><div class="rt">Cartas al director</div><p>Los comentarios los gestiona Disqus, un servicio externo que puede usar cookies y mostrar anuncios. Solo se carga si pulsas el botón. <a href="legal.html#cookies">Más información</a>.</p><button type="button" id="cm">Leer y escribir comentarios</button><div id="disqus_thread"></div></section>`:""}
 </article>`;
 const canon=location.origin+location.pathname+"?id="+encodeURIComponent(n.id);let url=canon;
 const sUrl=location.origin+location.pathname.replace(/[^/]*$/,"")+"n/"+String(n.id).replace(/[^A-Za-z0-9_-]/g,"")+".html";
 fetch(sUrl,{method:"HEAD"}).then(r=>{if(r.ok)url=sUrl}).catch(()=>{});
 const cp=document.getElementById("cp"),sh=document.getElementById("sh");
 cp.onclick=async()=>{try{await navigator.clipboard.writeText(url)}catch(e){const t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}t.remove()}
  cp.textContent="Enlace copiado";setTimeout(()=>cp.textContent="Copiar enlace",2000)};
 const cm=document.getElementById("cm");
 if(cm)cm.onclick=()=>{cm.remove();window.disqus_config=function(){this.page.url=canon;this.page.identifier=n.id;this.page.title=n.titulo};
  const d=document.createElement("script");d.src="https://"+DISQUS+".disqus.com/embed.js";d.async=true;d.setAttribute("data-timestamp",+new Date());document.body.appendChild(d)};
 if(sh)sh.onclick=()=>navigator.share({title:n.titulo,url}).catch(()=>{});
 fit();addEventListener("resize",fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
});
</script>
</body>
</html>
