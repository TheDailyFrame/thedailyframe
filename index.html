<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Frame</title>
<link rel="alternate" type="application/rss+xml" title="The Daily Frame" href="rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fafafa;--mute:#6e6e73;--line:#d2d2d7;--f:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.5 var(--f);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;object-fit:cover;background:#e5e5e5;filter:grayscale(1) contrast(1.08)}
.wrap{max-width:1560px;margin:auto;padding:0 28px}
.strip{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font:600 12px var(--f);letter-spacing:.04em;border-bottom:1px solid var(--ink)}
.strip .motto{font-style:italic;font-weight:500;letter-spacing:.01em;font-size:13px}
.title{font-weight:900;font-size:clamp(30px,10.5vw,172px);letter-spacing:-.06em;line-height:.9;text-align:center;white-space:nowrap;padding:22px 0 14px}
.dbl{height:8px;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink)}
.hero{display:block;padding:18px 0 22px}
.htop{font-weight:900;letter-spacing:-.05em;line-height:1.06;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(26px,4.2vw,62px)}
.hero img{aspect-ratio:16/6;max-height:38vh}
.cap{margin-top:12px}
.cap p{font-size:21px;line-height:1.35;color:#222;max-width:none}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:7px;border-top:1px solid var(--ink);font:600 12px var(--f);letter-spacing:.02em;color:var(--mute)}
.meta span:last-child{text-transform:uppercase;letter-spacing:.06em;text-align:right}
.k{font:700 12px var(--f);letter-spacing:.02em;display:inline-block;border-bottom:2px solid var(--ink);padding-bottom:2px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin:16px 0 4px}
.tabs{display:flex;gap:22px;flex-wrap:wrap;margin:0}
.q{font:500 14px var(--f);width:210px;max-width:100%;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);padding:5px 0;outline:none;-webkit-appearance:none;appearance:none}
.q::placeholder{color:var(--mute)}.q:focus{border-bottom-width:2px;padding-bottom:4px}
footer a{text-decoration:underline;text-underline-offset:3px}
.tabs button{font:600 14px var(--f);letter-spacing:-.01em;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);padding:4px 0;cursor:pointer}
.tabs button:hover{color:var(--ink)}.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.empty{padding:90px 0;text-align:center;color:var(--mute)}
.sep{display:flex;align-items:center;gap:14px;margin:4px 0 0}
.sep i{flex:1;height:7px;background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.5}
.sep span{font:600 11px var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.book{max-width:1560px;margin:20px auto 0;padding:0 28px}
.spread{display:none;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 12px 32px -22px rgba(0,0,0,.18)}
.spread.on{display:grid}
.pg{padding:34px 36px 18px;display:flex;flex-direction:column;min-height:760px}
.pg:nth-child(2){border-left:1px solid var(--line);background:linear-gradient(90deg,rgba(0,0,0,.04),transparent 28px)}
.pg:nth-child(1){background:linear-gradient(270deg,rgba(0,0,0,.04),transparent 28px)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:34px 30px;flex:1;align-content:start}
.fr{display:block;overflow:hidden;background:#e5e5e5}
.card img{aspect-ratio:16/10}.card .fr{margin-bottom:14px}
.kr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pr{font:600 11px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card h3{font-weight:800;font-size:23px;letter-spacing:-.035em;line-height:1.1}
.card p{font-size:14.5px;color:#3a3a3c;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{text-decoration:underline;text-underline-offset:4px}
.num{display:flex;justify-content:space-between;margin-top:26px;padding-top:10px;border-top:1px solid var(--ink);font:600 12px var(--f)}
.nav{position:sticky;bottom:18px;z-index:5;width:max-content;max-width:calc(100% - 24px);margin:26px auto 40px;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.nav button{font:600 14px var(--f);border:0;background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
.nav button:hover:not(:disabled){background:#ececec}.nav button:disabled{opacity:.3;cursor:default}
.nav .pdf{background:var(--ink);color:#fff}.nav .pdf:hover{background:#333!important}
.nav.solo .pn,.nav.solo span{display:none}
.nav span{font:500 13px var(--f);color:var(--mute);padding:0 8px;min-width:120px;text-align:center}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
footer{text-align:center;font-size:12px;color:var(--mute);padding-bottom:40px}
@media(max-width:899px){
 .hero img{aspect-ratio:16/10;max-height:40vh}.cap p{font-size:16px}
 .spread,.spread.on{display:block;background:none;border:0;border-radius:0;box-shadow:none}
 .pg,.pg:nth-child(1),.pg:nth-child(2){padding:26px 0 8px;min-height:0;background:none;border-left:0;border-top:1px solid var(--ink)}
 .cards{grid-template-columns:1fr;gap:34px}.card h3{font-size:24px}
 .nav .pn,.nav span{display:none}.num{display:none}
 .strip{font-size:11px}.strip span{white-space:nowrap}.strip .motto,.strip span:last-child{display:none}
 .meta{flex-wrap:wrap}
 .tools{flex-direction:column;align-items:stretch;gap:12px}.q{width:100%}
 .tabs{flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.tabs button{white-space:nowrap}
}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff}.nav,footer,.sep,.tools{display:none}
 .book{padding:0;margin:0;max-width:none}
 .cover{break-after:page}
 .title{font-size:84px;padding:16px 0 10px}.strip{padding:8px 0}.hero{padding:14px 0 0}.hero img{aspect-ratio:3/1;max-height:none}
 .htop{font-size:34px!important}.cap p{font-size:14px}.wrap{max-width:none;padding:0 14px}
 .spread,.spread.on{display:grid;break-after:page;border:0;border-radius:0;box-shadow:none;break-inside:avoid}
 .pg{min-height:0;background:none!important;padding:0 14px}
 .card img{aspect-ratio:16/7}.card .fr{margin-bottom:8px}.card h3{font-size:18px}.card p{-webkit-line-clamp:2;font-size:12px}.cards{gap:14px}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap cover" id="cover"></div>
<div class="book" id="book"></div>
<div class="nav" id="nav">
 <button class="pn" id="prev" aria-label="Páginas anteriores">‹ Anterior</button>
 <span id="pos"></span>
 <button class="pn" id="next" aria-label="Páginas siguientes">Siguiente ›</button>
 <button class="pdf" onclick="print()">Exportar PDF</button>
</div>
<footer id="foot"></footer>
<script>
const NAME="The Daily Frame", MOTTO="Todo lo que merece ser contado", DATA="data/noticias.json";
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtS=d=>new Date(d+"T12:00").toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
const roman=n=>{n=Math.floor(n);if(n<1||n>3999)return String(n);let r="";[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]].forEach(([v,s])=>{while(n>=v){r+=s;n-=v}});return r};
const plain=s=>String(s||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/[#>*\-_]/g,"").replace(/\s+/g," ").trim();
document.title=NAME;
let spreads=[],cur=0,sec="";
const hashOf=()=>(sec?encodeURIComponent(sec)+".":"")+"p"+cur;
const q=(v,d,a,b)=>{v=parseFloat(v);return isNaN(v)?d:Math.min(b,Math.max(a,v))};
const fr=(n,alt)=>{const x=q(n.fx,50,0,100),y=q(n.fy,50,0,100),z=q(n.fz,1,1,3);return `<span class="fr"><img src="${esc(n.img)}" alt="${esc(alt||n.pie||n.titulo)}" style="object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%" loading="lazy"></span>`};

function card(n,pg){return `<a class="card" href="noticias.html?id=${encodeURIComponent(n.id)}">
 ${n.img?fr(n):""}
 <div class="kr"><div class="k">${esc(n.seccion||"Actualidad")}</div><span class="pr">Pág. ${pg}</span></div><h3>${esc(n.titulo)}</h3>
 <p>${esc(n.subtitulo||plain(n.cuerpo).slice(0,160))}</p></a>`}
function show(i,skip){cur=Math.max(0,Math.min(spreads.length-1,i));if(!skip&&(spreads.length>1||sec))history.replaceState(null,"","#"+hashOf());
 document.querySelectorAll(".spread").forEach((s,j)=>s.classList.toggle("on",j===cur));
 $("#prev").disabled=cur===0;$("#next").disabled=cur>=spreads.length-1;
 $("#pos").textContent=spreads.length?`Páginas ${2+cur*2}–${3+cur*2}`:"";}
/* Titular de portada: grande si es corto, se encoge lo justo para no pasar de 3 líneas */
function fit(){const h=$("#htop");if(!h)return;
 let s=Math.min(innerWidth*.08,150);if(s<22)s=22;
 const over=()=>{const lh=s*1.06;return h.scrollHeight>lh*3+2||h.scrollHeight>innerHeight*.32};
 h.style.fontSize=s+"px";
 while(over()&&s>22){s-=2;h.style.fontSize=s+"px"}}
fetch(DATA+"?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>[]).then(all=>{
 all.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
 const top=all.find(n=>n.portada)||all[0], rest=all.filter(n=>n!==top);
 const today=new Date().toISOString().slice(0,10), fecha=top&&top.fecha?top.fecha:today;
 const last=all.length&&all[0].fecha?all[0].fecha:fecha, nuevas=all.filter(n=>n.fecha===last).length;
 const head=`<div class="strip"><span>${fmt(last)}</span><span class="motto">${esc(MOTTO)}</span><span>${nuevas?nuevas+(nuevas===1?" noticia nueva":" noticias nuevas"):""}</span></div>
 <h1 class="title">${esc(NAME)}</h1><div class="dbl"></div>`;
 $("#cover").innerHTML=head+(top?`<a class="hero" href="noticias.html?id=${encodeURIComponent(top.id)}">
  <h1 class="htop" id="htop">${esc(top.titulo)}</h1>
  ${top.img?fr(top):""}
  <div class="cap"><p>${esc(top.subtitulo||plain(top.cuerpo).slice(0,200))}</p>
  <div class="meta"><span>Por ${esc(top.autor||"Redacción")}</span><span>${fmtS(fecha)} · ${esc(top.seccion||"Portada")}</span></div></div></a>`
  :`<div class="empty">Aún no hay noticias.<br>Publica la primera desde admin.html.</div>`)
  +(rest.length?`<div class="sep"><i></i><span>Páginas interiores</span><i></i></div><div class="tools"><div class="tabs" id="tabs"></div><input class="q" id="q" type="search" placeholder="Buscar en el periódico…" aria-label="Buscar" autocomplete="off"></div>`:"");
 fit();addEventListener("resize",fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
 const SEC=n=>n.seccion||"Actualidad";
 const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const idx=new Map();const hay=n=>{if(!idx.has(n))idx.set(n,norm([n.titulo,n.subtitulo,n.seccion,n.autor,plain(n.cuerpo)].join(" ")));return idx.get(n)};
 let qs="";const qi=$("#q");if(qi){let h;qi.oninput=()=>{clearTimeout(h);h=setTimeout(()=>{qs=qi.value.trim();build();show(0)},150)}}
 const counts={};rest.forEach(n=>counts[SEC(n)]=(counts[SEC(n)]||0)+1);
 const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b,"es"));
 const tabs=$("#tabs");
 function paint(){if(tabs)tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===sec))}
 function build(){
  const nq=norm(qs);let list=qs?all.filter(n=>hay(n).includes(nq)):rest;if(sec)list=list.filter(n=>SEC(n)===sec);
  const pages=[];for(let i=0;i<list.length;i+=4)pages.push(list.slice(i,i+4));
  spreads=[];for(let i=0;i<pages.length;i+=2)spreads.push(pages.slice(i,i+2));
  if(!list.length){$("#book").innerHTML=`<div class="empty">${qs?"No hay noticias que coincidan con «"+esc(qs)+"».":"Aún no hay noticias."}</div>`;$("#nav").classList.add("solo");return}
  $("#book").innerHTML=spreads.map((sp,i)=>`<section class="spread">${sp.map((p,j)=>{const pg=2+i*2+j;return `<div class="pg"><div class="cards">${p.map(n=>card(n,pg)).join("")}</div>
  <div class="num"><span>${pg}</span><span>${esc(NAME)}</span></div></div>`}).join("")}</section>`).join("");
  $("#nav").classList.toggle("solo",spreads.length<2);
 }
 if(tabs){
  if(names.length>1){
   tabs.innerHTML=["",...names].map(s=>`<button type="button" data-s="${esc(s)}">${s?esc(s):"Todo"}</button>`).join("");
   tabs.onclick=e=>{const b=e.target.closest("button");if(!b)return;sec=b.dataset.s;paint();build();show(0)};
  }else tabs.remove();
 }
 const parse=()=>{const m=location.hash.match(/^#(?:(.+)\.)?p(\d+)$/);let s="";if(m&&m[1]){try{s=decodeURIComponent(m[1])}catch(e){}}return{s:names.includes(s)?s:"",p:m?parseInt(m[2]):0}};
 $("#foot").innerHTML=`${esc(NAME)} · ${new Date().getFullYear()} · <a href="legal.html">Aviso legal y cookies</a> · <a href="rss.xml">RSS</a>`;
 $("#prev").onclick=()=>show(cur-1);$("#next").onclick=()=>show(cur+1);
 addEventListener("hashchange",()=>{if(!/^#(.+\.)?p\d+$/.test(location.hash))return;const h=parse();if(h.s!==sec){sec=h.s;paint();build()}show(h.p,true)});
 addEventListener("keydown",e=>{if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
 const h0=parse();sec=h0.s;paint();build();show(h0.p);
});
</script>
</body>
</html>
